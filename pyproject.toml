[project]
name = "arabic-rag"
version = "0.1.0"
description = "Arabic RAG assistant over Monsha'at official documents"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
# Added phase by phase, so week 1 installs fast.
retrieval = ["rank-bm25>=0.2", "qdrant-client>=1.9", "FlagEmbedding>=1.2", "sentence-transformers>=3.0"]
arabic = ["camel-tools>=1.5"]
app = ["fastapi>=0.110", "uvicorn>=0.29", "streamlit>=1.35"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
